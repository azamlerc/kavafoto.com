<Directory /var/www/html>
    Options -Indexes -MultiViews
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_FILENAME}.php -f
    RewriteRule ^(.+)$ $1.php [END]
    AllowOverride None
    Require all granted
</Directory>
<DirectoryMatch "(?:^|/)\.(?:git|agents|codex)(?:/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^(?:Dockerfile|README\.md|apache-site\.conf|fly\.toml)$">
    Require all denied
</FilesMatch>
